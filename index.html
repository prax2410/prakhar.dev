    <script>
      (function() {
        try {
          var savedColor = localStorage.getItem('prakhar_portfolio_color');
          if (savedColor === 'navy') {
            localStorage.setItem('prakhar_portfolio_color', 'slate');
            savedColor = 'slate';
          } else if (!savedColor) {
            savedColor = 'slate';
          }
          var saved = localStorage.getItem('prakhar_portfolio_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved !== null ? saved === 'dark' : prefersDark;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
          }
          root.classList.add('theme-' + savedColor);
        } catch (e) {}
      })();
    </script>
