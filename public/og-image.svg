<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#090d1a"/>
  
  <!-- Subtle Gradient Glows -->
  <circle cx="150" cy="150" r="300" fill="#0284c7" opacity="0.12" filter="blur(80px)"/>
  <circle cx="1050" cy="480" r="350" fill="#10b981" opacity="0.10" filter="blur(90px)"/>
  
  <!-- Grid Overlay -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="24" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Logo Pill -->
  <g transform="translate(80, 80)">
    <rect width="52" height="52" rx="14" fill="#ffffff"/>
    <text x="26" y="36" fill="#090d1a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" text-anchor="middle">P</text>
    <text x="70" y="34" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="16" font-weight="600" letter-spacing="2">SENIOR SOFTWARE ENGINEER</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">
    Prakhar
  </text>
  <text x="80" y="300" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="500">
    Full Stack • Enterprise SaaS • IIoT
  </text>

  <!-- Tag Pills -->
  <g transform="translate(80, 360)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="110" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Enterprise ERP &amp; SaaS</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="345" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">IIoT &amp; MQTT</text>

    <!-- Pill 3 -->
    <rect x="470" y="0" width="220" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="580" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Node.js • React • Postgres</text>

    <!-- Pill 4 -->
    <rect x="705" y="0" width="200" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="805" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Azure &amp; AWS Deployments</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(80, 520)">
    <circle cx="6" cy="-6" r="5" fill="#10b981"/>
    <text x="24" y="-2" fill="#cbd5e1" font-family="'Fira Code', monospace" font-size="15">YM Automation Pvt Ltd • 4+ Years Experience • Bengaluru, India</text>
    <text x="1040" y="-2" fill="#64748b" font-family="'Fira Code', monospace" font-size="15" text-anchor="end">prax2410.github.io/portfolio</text>
  </g>
</svg>
